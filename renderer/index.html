<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Floating Box</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="box">
    <header class="drag">
      <span class="dot"></span>
      <span class="title">Floating Box</span>
      <span class="spacer"></span>
      <button class="icon no-drag" id="btn-hide" title="숨기기 (트레이에서 다시 열기)">—</button>
      <button class="icon no-drag" id="btn-quit" title="종료">×</button>
    </header>

    <section id="clock">
      <div class="time" id="clock-time">--:--:--</div>
      <div class="date" id="clock-date"></div>
    </section>

    <section id="timer">
      <div class="row">
        <span class="label">작업 타이머</span>
        <span class="target">
          목표 <input id="timer-target" type="number" min="0" max="600" step="5" value="0" /> 분
        </span>
      </div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="progress"><div class="bar" id="timer-bar"></div></div>
      <div class="controls">
        <button id="timer-toggle">시작</button>
        <button id="timer-reset" class="ghost">리셋</button>
      </div>
    </section>

    <section id="usage">
      <div class="row">
        <span class="label">Claude 사용량</span>
        <button class="link" id="usage-refresh" title="새로고침">↻</button>
      </div>
      <div id="usage-plan"></div>
      <div id="usage-code"></div>
      <div class="muted" id="usage-meta"></div>
    </section>

    <section id="notifs">
      <div class="row">
        <span class="label">알림 <span class="badge" id="notif-badge">0</span></span>
        <span>
          <button class="link" id="notif-readall">모두 읽음</button>
          <button class="link" id="notif-clear">비우기</button>
        </span>
      </div>
      <ul id="notif-list"></ul>
      <div class="muted" id="notif-hint"></div>
    </section>
  </div>

  <div id="toast" hidden></div>

  <script src="timer.js"></script>
  <script src="app.js"></script>
</body>
</html>
