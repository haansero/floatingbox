<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Floating Box</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="box">
    <!-- 시계: 드래그 핸들 -->
    <div id="clock" class="drag" title="드래그로 이동 · 우클릭 메뉴">
      <div class="c-row"><span id="clock-time">--:--</span><span id="clock-sec">--</span></div>
      <div id="clock-date"></div>
    </div>

    <!-- 타이머: 클릭 = 시작/중지, 길게 = 리셋 -->
    <div id="timer" title="클릭: 시작/중지 · 길게 누르기: 리셋">
      <div class="progress"><div class="bar" id="timer-bar"></div></div>
      <div class="t-row">
        <span id="timer-display">00:00:00</span>
        <span class="stepper" title="목표 시간 (홑: 10분, 겹: 1시간)">
          <button class="step" data-step="-60">&#9664;&#9664;</button><button class="step" data-step="-10">&#9664;</button>
          <span id="timer-target">00:00</span>
          <button class="step" data-step="10">&#9654;</button><button class="step" data-step="60">&#9654;&#9654;</button>
        </span>
      </div>
    </div>

    <!-- 사용량: 막대만, 클릭하면 수치 -->
    <div id="usage" class="collapsible" title="클릭: 자세히">
      <div id="usage-bars"></div>
      <div id="usage-detail" class="detail" hidden></div>
    </div>

    <!-- 알림: 최신 한 줄, 클릭하면 목록 -->
    <div id="notifs" class="collapsible">
      <div id="notif-line" title="클릭: 알림 목록">
        <span class="badge" id="notif-badge">0</span>
        <span id="notif-latest" class="one-line">알림 없음</span>
      </div>
      <div id="notif-panel" class="detail" hidden>
        <div class="tools">
          <button class="link" id="notif-readall">모두 읽음</button>
          <button class="link" id="notif-clear">비우기</button>
        </div>
        <ul id="notif-list"></ul>
      </div>
    </div>
  </div>

  <script src="timer.js"></script>
  <script src="app.js"></script>
</body>
</html>
